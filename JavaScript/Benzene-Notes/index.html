<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Benzene Notes</title>
</head>
<body>
    <!-- //Navbar -->
    <nav>
        <h3 id="navHeading">Benzene Notes</h3>

        <div class="select-container">
            <select id="myBoards"></select>

            <button class="create-btn" id="createBoard" onclick="newBoardOn()">Create Board</button>
        </div>

        <div class="nav-right">
            <img src="./assets/brightness.png" alt="Theme toggle" width="24" id="toggleThemeBtn">
            <a href="https://github.com/madarame-rafiq/" target="_blank" id="githubLogo"><img src="./assets/github.png" alt="Github logo" width="24"></a>
        </div>
    </nav>

    <!-- //Contains inbox and board -->
    <main>

        <!-- //Inbox -->
        <div class="inbox">
            <!-- //heading -->
            <div class="top">
                <h3>Inbox</h3>
            </div>
            
            <!-- //Creatting new task -->
            <div class="create-task">
                <h4>create new task</h4>
                <div class="newtask-container">
                    <input type="text" id="newTaskInput" placeholder="Enter task">
                    <button class="create-btn" id="createTask">+</button>
                </div>
            </div>
            <!-- //Will contain all the tasks in inbox -->
            <div class="task-container">
                
            </div>
            
        </div>
        
        <!-- //Board -->
        <div class="board">
            <!-- //heading -->
             <div class="top">
                 <h3 id="boardHeading"></h3>
                 <button id="deleteBoardBtn" class="create-btn">Delete Board</button>
             </div>

             <!-- //contains all the goals -->
              <div class="goal-container">
                
            
                <!-- //Create new goal -->
                    <!-- <div class="create-goal">
                        <h4>create new goal</h4>
                        <div class="newgoal-container">
                            <input type="text" id="newGoalInput" placeholder="Enter goal">
                            <button class="create-btn" id="createGoal">+</button>
                        </div>
                    </div> -->
              </div>

         </div>

    </main>


    <div class="newboardContainer">
        <div class="bg" onclick="newBoardOff()"></div>
        <div class="createNewBoard">
            <input type="text" placeholder="Enter board name" id="newBoardInput">
            <button class="create-btn" id="newBoard" onclick="createBoard()">Create</button>
        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
